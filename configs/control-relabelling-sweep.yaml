# Relabelling sweep: the labelling effect as a distribution, not an anecdote.
#
# Every constrained map appears three ways — as itself, as the named single control
# (`_relabelled`, the stored derangement that removes every identity-aligned edge), and
# as 24 sweep members (`_perm00` .. `_perm23`, deterministically derived from a SHA-256
# keystream). All 26 variants of a base are the SAME GRAPH: identical edge count, degree
# sequence, diameter, mean shortest path and cycle spectrum. Only the physical-qubit
# numbering differs.
#
# complete_27 is present because it is the penalty denominator, not because it is under
# test: a fully connected map has no labelling to break.
#
# 53 topologies x 4 families x 6 sizes x 3 levels x 5 seeds = 19,080 compilations.
physical_qubits: 27
logical_qubits: [4, 8, 12, 16, 20, 24]
circuit_families: [qft, ghz_chain, ghz_star, efficient_su2]
